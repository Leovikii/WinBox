name: CI/CD

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'assets/**'
      - 'test/**'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'assets/**'
      - 'test/**'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            rust-target: x86_64-pc-windows-msvc
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build Tauri bundles
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f
        with:
          projectPath: .
          args: --target ${{ matrix.rust-target }} --bundles nsis,msi

      - name: Package architecture assets
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          TARGET_DIR="src-tauri/target/${{ matrix.rust-target }}/release"
          test -f "$TARGET_DIR/WinBox.exe"
          test -f "$TARGET_DIR/winbox-updater.exe"
          mkdir -p release-assets
          mkdir WinBox
          cp "$TARGET_DIR/WinBox.exe" WinBox/WinBox.exe
          cp "$TARGET_DIR/winbox-updater.exe" WinBox/WinBox-updater.exe
          7z a -tzip "release-assets/WinBox-v${VERSION}-windows-${{ matrix.arch }}.zip" WinBox/
          cp "$(find "$TARGET_DIR/bundle/nsis" -maxdepth 1 -type f -name '*-setup.exe' -print -quit)" \
            "release-assets/WinBox-${VERSION}-windows-${{ matrix.arch }}-setup.exe"
          cp "$(find "$TARGET_DIR/bundle/msi" -maxdepth 1 -type f -name '*.msi' -print -quit)" \
            "release-assets/WinBox-${VERSION}-windows-${{ matrix.arch }}.msi"

      - name: Upload architecture assets
        uses: actions/upload-artifact@v4
        with:
          name: winbox-${{ matrix.arch }}
          path: release-assets/*
          if-no-files-found: error

  release:
    if: github.event_name == 'push'
    needs: build
    runs-on: windows-latest
    env:
      VERSION: ''
      CHANGELOG: ''
      IS_PRERELEASE: 'false'
      MAKE_LATEST: 'true'
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download architecture assets
        uses: actions/download-artifact@v4
        with:
          pattern: winbox-*
          path: release-assets
          merge-multiple: true

      - name: Get Version
        run: echo "VERSION=v$(node -p \"require('./src-tauri/tauri.conf.json').version\")" >> $GITHUB_ENV

      - name: Generate Changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            LOGS=$(git log --pretty=format:"- %s" --no-merges)
          else
            LOGS=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s" --no-merges)
          fi
          echo "CHANGELOG<<EOF" >> $GITHUB_ENV
          echo "$LOGS" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Check Prerelease Status
        if: github.event_name == 'push'
        run: |
          if [[ "${{ env.VERSION }}" == *"-"* ]]; then
            echo "IS_PRERELEASE=true" >> $GITHUB_ENV
            echo "MAKE_LATEST=false" >> $GITHUB_ENV
          else
            echo "IS_PRERELEASE=false" >> $GITHUB_ENV
            echo "MAKE_LATEST=true" >> $GITHUB_ENV
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.VERSION }}
          name: WinBox ${{ env.VERSION }}
          body: |
            ### Changes
            ${{ env.CHANGELOG }}
          files: release-assets/*
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
          make_latest: ${{ env.MAKE_LATEST }}
