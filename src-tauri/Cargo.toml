[package]
name = "winbox-tauri"
version = "3.0.0-alpha.1"
description = "WinBox backend core"
authors = ["WinBox contributors"]
edition = "2021"
rust-version = "1.97"
default-run = "WinBox"

[lib]
name = "winbox_backend"
path = "src/lib.rs"

[[bin]]
name = "WinBox"
path = "src/main.rs"
test = false

[[bin]]
name = "winbox-updater"
path = "src/updater.rs"
test = false

[dependencies]
tauri = { version = "2.11.5", features = ["image-ico", "tray-icon"] }
tauri-plugin-opener = "2.5.5"
tauri-plugin-single-instance = "2.4.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "stream"] }
uuid = { version = "1.26.1", features = ["v4"] }
futures-util = { version = "0.3.31", default-features = false, features = ["std"] }
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "process", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
zip = { version = "4.6.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
